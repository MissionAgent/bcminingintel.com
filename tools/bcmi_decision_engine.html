function BCMIDecisionTree() {
  const [activeCategory, setActiveCategory] = useState("all");
  const [activePriority, setActivePriority] = useState("all");
  const [search, setSearch] = useState("");
  const [expandedId, setExpandedId] = useState(null);

  const categoryCounts = useMemo(() => {
    const counts = {};
    CATEGORIES.forEach(c => {
      counts[c.id] = c.id === "all"
        ? decisions.length
        : decisions.filter(d => d.category === c.id).length;
    });
    return counts;
  }, []);

  const filtered = useMemo(() => {
    return decisions.filter(d => {
      if (activeCategory !== "all" && d.category !== activeCategory) return false;
      if (activePriority !== "all" && d.priority !== activePriority) return false;
      if (search) {
        const q = search.toLowerCase();
        return (
          d.trigger.toLowerCase().includes(q) ||
          d.fromState.toLowerCase().includes(q) ||
          d.toState.toLowerCase().includes(q) ||
          d.platformSignal.toLowerCase().includes(q) ||
          d.userAction.toLowerCase().includes(q)
        );
      }
      return true;
    });
  }, [activeCategory, activePriority, search]);

  const catColor = (id) => CATEGORIES.find(c => c.id === id)?.color || "var(--text-dim)";

  return (
    <div style={{
      minHeight: "100vh",
      background: "var(--bg-deep)",
      fontFamily: "var(--font-sans)",
      color: "var(--text-hi)",
    }}>
      
      <style>{`
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { height: 4px; width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-card); }
        ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 2px; }
        .row-item { transition: background 0.12s ease; cursor: pointer; }
        .row-item:hover { background: var(--border) !important; }
        .cat-pill { transition: all 0.15s ease; cursor: pointer; border: 1px solid transparent; }
        .cat-pill:hover { border-color: rgba(232,168,48,0.3); }
        .expand-content { animation: slideIn 0.15s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .mono { font-family: var(--font-mono); }
        .display { font-family: var(--font-cond); }
      `}</style>

      {/* HEADER */}
      <div style={{
        borderBottom: "1px solid var(--border)",
        padding: "24px 28px 20px",
        background: "linear-gradient(180deg, var(--bg-card2) 0%, var(--bg-deep) 100%)",
      }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
              <div style={{
                fontFamily: "var(--font-cond)",
                fontSize: 22,
                fontWeight: 700,
                color: "var(--gold)",
                letterSpacing: "-0.3px",
              }}>BC Mining Intel</div>
              <div style={{
                fontFamily: "var(--font-mono)",
                fontSize: 10,
                color: "var(--text-dim)",
                border: "1px solid var(--border-hi)",
                borderRadius: 3,
                padding: "2px 7px",
                letterSpacing: "0.5px",
              }}>DECISION ENGINE v1</div>
            </div>
            <div style={{ fontSize: 13, color: "var(--text-dim)", fontStyle: "italic" }}>
              State-change triggers, cascade impacts & subscriber action table — Golden Triangle intelligence platform
            </div>
          </div>
          {/* Stats row */}
          <div style={{ display: "flex", gap: 16, flexWrap: "wrap" }}>
            {[
              { label: "Total Signals", val: decisions.length, color: "var(--text-hi)" },
              { label: "Critical", val: decisions.filter(d => d.priority === "critical").length, color: "var(--red)" },
              { label: "High", val: decisions.filter(d => d.priority === "high").length, color: "var(--gold)" },
              { label: "Medium", val: decisions.filter(d => d.priority === "medium").length, color: "var(--blue)" },
            ].map(s => (
              <div key={s.label} style={{ textAlign: "center" }}>
                <div style={{ fontFamily: "var(--font-mono)", fontSize: 22, fontWeight: 500, color: s.color, lineHeight: 1 }}>{s.val}</div>
                <div style={{ fontSize: 10, color: "var(--text-dim)", marginTop: 3, letterSpacing: "0.3px" }}>{s.label}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Category tabs */}
        <div style={{
          display: "flex", gap: 6, marginTop: 20,
          overflowX: "auto", paddingBottom: 4,
        }}>
          {CATEGORIES.map(cat => {
            const active = activeCategory === cat.id;
            const color = cat.color || "var(--gold)";
            return (
              <button key={cat.id} className="cat-pill" onClick={() => setActiveCategory(cat.id)} style={{
                background: active ? `${color}18` : "transparent",

                borderRadius: 6,
                padding: "5px 12px",

                  background: active ? `${color}30` : "var(--border)",
                  color: active ? color : "var(--text-dim)",
                  borderRadius: 10,
                  padding: "1px 6px",
                  fontSize: 10,
                }}>{categoryCounts[cat.id]}</span>
              </button>
            );
          })}
        </div>

        {/* Search + priority filter */}

          <input

              flex: 1, minWidth: 200,
              background: "var(--bg-card)",
              border: "1px solid var(--border-hi)",

                border: `1px solid ${activePriority === p
                  ? (p === "all" ? "var(--border-hi)" : PRIORITY_CONFIG[p]?.color || "var(--border-hi)")
                  : "var(--border-hi)"}`,
                borderRadius: 6,
                padding: "5px 11px",
                color: activePriority === p
                  ? (p === "all" ? "var(--text-hi)" : PRIORITY_CONFIG[p]?.color || "var(--text-hi)")
                  : "var(--text-dim)",
                fontSize: 11,
                fontFamily: "var(--font-mono)",

        padding: "8px 28px",
        borderBottom: "1px solid var(--border)",
        background: "var(--bg-deep)",
      }}>
        {["PRIORITY", "TRIGGER → STATE CHANGE", "PLATFORM SIGNAL", "VAULT Δ", "WHO IS IMPACTED"].map((h, i) => (
          <div key={h} style={{
            fontSize: 9,

        {filtered.length === 0 && (

        {filtered.map((d, idx) => {
          const isOpen = expandedId === d.id;
          const catCol = catColor(d.category);
          const pCfg = PRIORITY_CONFIG[d.priority];
          const vaultKey = String(d.vaultDelta);
          const vaultDisplay = VAULT_DELTA_DISPLAY[vaultKey] || VAULT_DELTA_DISPLAY["0"];

          return (
            <div key={d.id} style={{ borderBottom: "1px solid var(--bg-card)" }}>
              {/* Main row */}
              <div
                className="row-item"
                onClick={() => setExpandedId(isOpen ? null : d.id)}
                style={{
                  display: "grid",
                  gridTemplateColumns: "80px 1fr 1fr 60px 180px",
                  gap: 0,
                  padding: "13px 28px",
                  background: isOpen ? "var(--bg-card)" : (idx % 2 === 0 ? "var(--bg-deep)" : "var(--bg-deep)"),
                  borderLeft: `2px solid ${catCol}`,
                  alignItems: "start",
                }}
              >
                {/* Priority */}
                <div>
                  <span style={{
                    display: "inline-block",
                    fontSize: 9,
                    fontFamily: "var(--font-mono)",
                    letterSpacing: "0.5px",
                    color: pCfg.color,
                    background: pCfg.bg,
                    border: `1px solid ${pCfg.color}40`,
                    borderRadius: 3,
                    padding: "2px 5px",
                  }}>{pCfg.label}</span>
                  <div style={{ fontSize: 9, color: "var(--text-dim)", marginTop: 4, fontFamily: "var(--font-mono)" }}>
                    {d.id}
                  </div>
                </div>

                {/* Trigger + State change */}
                <div style={{ paddingRight: 16 }}>
                  <div style={{ fontSize: 13, color: "var(--text-hi)", marginBottom: 5, lineHeight: 1.4 }}>
                    {d.trigger}
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
                    <span style={{
                      fontSize: 10,
                      fontFamily: "var(--font-mono)",
                      color: "var(--text-dim)",
                      background: "var(--bg-card)",
                      border: "1px solid var(--border-hi)",
                      borderRadius: 3,
                      padding: "2px 6px",
                    }}>{d.fromState}</span>
                    <span style={{ color: "var(--gold)", fontSize: 11 }}>→</span>
                    <span style={{
                      fontSize: 10,
                      fontFamily: "var(--font-mono)",
                      color: catCol,
                      background: `${catCol}12`,
                      border: `1px solid ${catCol}40`,
                      borderRadius: 3,
                      padding: "2px 6px",
                    }}>{d.toState}</span>
                  </div>
                  <div style={{ fontSize: 10, color: "var(--text-dim)", marginTop: 5, fontStyle: "italic" }}>
                    ⏱ {d.timeHorizon}
                  </div>
                </div>

                {/* Platform Signal (abbreviated) */}
                <div style={{ paddingRight: 16 }}>
                  <div style={{ fontSize: 12, color: "var(--text-mid)", lineHeight: 1.45 }}>
                    {d.platformSignal.length > 110
                      ? d.platformSignal.slice(0, 110) + "…"
                      : d.platformSignal}
                  </div>
                </div>

                {/* Vault Delta */}
                <div style={{ textAlign: "center" }}>
                  <div style={{
                    display: "inline-flex",
                    alignItems: "center",
                    justifyContent: "center",
                    width: 36,
                    height: 36,
                    borderRadius: "50%",
                    background: `${vaultDisplay.color}15`,
                    border: `1px solid ${vaultDisplay.color}40`,
                    fontFamily: "var(--font-mono)",
                    fontSize: 13,
                    fontWeight: 500,
                    color: vaultDisplay.color,
                  }}>{vaultDisplay.label}</div>
                </div>

                {/* Impacts */}
                <div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 4 }}>
                    {d.impacts.map(imp => {
                      const cfg = IMPACT_CONFIG[imp];
                      return (
                        <span key={imp} style={{
                          fontSize: 9,
                          fontFamily: "var(--font-mono)",
                          color: cfg.color,
                          background: cfg.bg,
                          border: `1px solid ${cfg.color}30`,
                          borderRadius: 3,
                          padding: "2px 5px",
                          letterSpacing: "0.3px",
                        }}>{cfg.label}</span>
                      );
                    })}
                  </div>
                  <div style={{
                    marginTop: 8,
                    fontSize: 10,
                    color: isOpen ? "var(--gold)" : "var(--text-dim)",
                    fontFamily: "var(--font-mono)",
                  }}>
                    {isOpen ? "▲ collapse" : "▼ expand"}
                  </div>
                </div>
              </div>

              {/* EXPANDED DETAIL PANEL */}
              {isOpen && (
                <div className="expand-content" style={{
                  background: "var(--bg-card2)",
                  borderTop: "1px solid var(--border)",
                  padding: "20px 28px 24px",
                  borderLeft: `2px solid ${catCol}`,
                }}>
                  <div style={{
                    display: "grid",
                    gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))",
                    gap: 20,
                  }}>
                    {/* Platform Signal — full */}
                    <DetailBlock
                      icon="◎"
                      title="Platform Signal"
                      color="var(--blue)"
                      content={d.platformSignal}
                    />

                    {/* User Action */}
                    <DetailBlock
                      icon="→"
                      title="Subscriber Action"
                      color="var(--gold)"
                      content={d.userAction}
                      mono={false}
                    />

                    {/* Vault note */}
                    <DetailBlock
                      icon="◆"
                      title="Vault Score Detail"
                      color={vaultDisplay.color}
                      content={d.vaultNote}
                      extra={
                        <div style={{
                          marginTop: 8,
                          display: "inline-flex",
                          alignItems: "center",
                          gap: 8,
                          background: `${vaultDisplay.color}10`,
                          border: `1px solid ${vaultDisplay.color}30`,
                          borderRadius: 4,
                          padding: "4px 10px",
                        }}>
                          <span style={{ fontFamily: "var(--font-mono)", fontSize: 16, color: vaultDisplay.color, fontWeight: 500 }}>{vaultDisplay.label}</span>
                          <span style={{ fontSize: 11, color: "var(--text-dim)" }}>{vaultDisplay.desc}</span>
                        </div>
                      }
                    />

                    {/* Snapshot */}
                    <DetailBlock
                      icon="📸"
                      title="Subscriber Snapshot Capture"
                      color="var(--teal)"
                      content={d.snapshot}
                      note="What a user would record at this decision point"
                    />
                  </div>

                  {/* Airtable field reference */}
                  <div style={{
                    marginTop: 16,
                    padding: "10px 14px",
                    background: "var(--bg-card2)",
                    border: "1px solid var(--border)",
                    borderRadius: 6,
                    display: "flex",
                    alignItems: "flex-start",
                    gap: 10,
                  }}>
                    <span style={{ color: "var(--gold)", fontSize: 12, marginTop: 1 }}>⌗</span>
                    <div>
                      <div style={{ fontSize: 9, color: "var(--text-dim)", fontFamily: "var(--font-mono)", letterSpacing: "0.5px", marginBottom: 4 }}>AIRTABLE FIELD REFERENCE</div>
                      <div style={{ fontSize: 11, color: "var(--text-dim)", fontFamily: "var(--font-mono)", lineHeight: 1.6 }}>{d.airtableField}</div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* FOOTER */}
      <div style={{
        borderTop: "1px solid var(--border)",
        padding: "16px 28px",
        display: "flex",
        justifyContent: "space-between",
        alignItems: "center",
        background: "var(--bg-deep)",
      }}>
        <div style={{ fontSize: 10, color: "var(--text-dim)", fontFamily: "var(--font-mono)" }}>
          BC MINING INTEL · DECISION ENGINE · FOR INFORMATIONAL PURPOSES ONLY · NOT FINANCIAL ADVICE
        </div>
        <div style={{ fontSize: 10, color: "var(--text-dim)", fontFamily: "var(--font-mono)" }}>
          {decisions.length} signals · June 2026
        </div>
      </div>
    </div>
  );
}

function DetailBlock({ icon, title, color, content, mono = false, extra, note }) {
  return (
    <div style={{
      background: "var(--bg-card2)",
      border: "1px solid var(--border)",
      borderRadius: 6,
      padding: "14px 16px",
    }}>
      <div style={{
        display: "flex",
        alignItems: "center",
        gap: 7,
        marginBottom: 8,
      }}>
        <span style={{ color, fontSize: 12 }}>{icon}</span>
        <span style={{
          fontSize: 9,
          fontFamily: "var(--font-mono)",
          color,
          letterSpacing: "0.7px",
        }}>{title.toUpperCase()}</span>
        {note && <span style={{ fontSize: 9, color: "var(--text-dim)", fontStyle: "italic" }}>— {note}</span>}
      </div>
      <div style={{
        fontSize: 12,
        color: "var(--text-mid)",
        lineHeight: 1.6,
        fontFamily: mono ? "var(--font-mono)" : "var(--font-sans)",
      }}>
        {content}
      </div>
      {extra && <div style={{ marginTop: 10 }}>{extra}</div>}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BCMIDecisionTree />);
  </script>
</body>
</html>
